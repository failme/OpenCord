name: Build

# Runs on windows-latest, not ubuntu — the project targets net8.0-windows (WinForms) and will
# not restore/build on a Linux runner.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore OpenCord.csproj

      - name: Build (Release)
        run: dotnet build OpenCord.csproj -c Release --no-restore

      # Program.cs has no headless mode any more (it's a GUI app, full stop) — launching it here
      # would just hang the runner waiting on a message loop with no desktop session behind it.
      # Confirming the exe actually got produced is the honest version of "did this work".
      - name: Confirm the exe was produced
        run: |
          if (-not (Test-Path bin\Release\net8.0-windows\OpenCord.exe)) {
            Write-Error "OpenCord.exe missing from build output"
            exit 1
          }
